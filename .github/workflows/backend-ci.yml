name: Backend CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — build, pruebas, cobertura y SonarCloud
    runs-on: ubuntu-latest

    env:
      # Valores de relleno solo para CI: las pruebas unitarias no usan base de datos real.
      DATABASE_URL: "postgresql://usuario:clave@localhost:5432/disfraz_test_db"
      JWT_SECRET: "ci-solo-pruebas"
      JWT_REFRESH_SECRET: "ci-solo-pruebas-refresh"
      STRIPE_SECRET_KEY: "sk_test_ci_relleno"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial para detectar código nuevo

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente de Prisma
        run: npm run prisma:generate

      - name: Verificar tipos y compilar
        run: npm run build

      # Falla si la cobertura de los servicios baja del umbral (vitest.services.config.ts).
      - name: Pruebas unitarias con puerta de cobertura
        run: npm run test:coverage:services

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage/services
          if-no-files-found: ignore

      # Solo corre si existe el secreto SONAR_TOKEN (ver LEEME).
      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && github.ref == 'refs/heads/main' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.coverage.exclusions=src/main.ts,src/config/**,src/common/logger.ts,src/common/express.d.ts,**/*.controller.ts,**/*.routes.ts,**/*.schema.ts,**/*.middleware.ts
            -Dsonar.exclusions=**/node_modules/**,dist/**,coverage/**,reports/**,prisma/**,scripts/**,features/**,**/*.d.ts
