# Balanceador de carga para las réplicas del backend.
# El DNS interno de Docker devuelve la IP de cada réplica de "backend"; nginx las vuelve a
# consultar cada 5 s, así que al hacer --scale backend=N las nuevas réplicas entran solas.

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    # Muestra qué réplica respondió (sirve de evidencia del balanceo).
    add_header X-Replica $upstream_addr always;

    location / {
        set $upstream http://backend:3000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una réplica no responde, prueba con otra (tolerancia a fallos).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
