# Configuración de SonarCloud (SonarQube Cloud) para el backend.
# Cambia projectKey y organization por los de tu cuenta (los muestra SonarCloud al importar el repo).
sonar.projectKey=Bashurv3rse_Disfraces-back
sonar.organization=Mauro Atavillos
sonar.projectName=Disfraces-back

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,reports/**,prisma/migrations/**,**/*.d.ts

# La cobertura se mide sobre la lógica de negocio (servicios), como pide la sesión 30.
sonar.javascript.lcov.reportPaths=coverage/services/lcov.info
sonar.coverage.inclusions=src/**/*.service.ts
